<!doctype html><meta charset="utf-8"><body style="font:16px sans-serif;padding:40px"><div id="pm" style="border:1px solid #ccc;padding:8px"></div><script type="module">
import {EditorState} from "https://esm.sh/prosemirror-state@1.4.3";import {EditorView} from "https://esm.sh/prosemirror-view@1.37.1";import {schema} from "https://esm.sh/prosemirror-schema-basic@1.2.3";import {keymap} from "https://esm.sh/prosemirror-keymap@1.2.2";import {baseKeymap} from "https://esm.sh/prosemirror-commands@1.6.2";
